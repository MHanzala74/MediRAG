<svg xmlns="http://www.w3.org/2000/svg" width="960" viewBox="0 0 960 920" style="background:#0d1117;font-family:ui-sans-serif,system-ui,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f85149" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Section labels -->
  <text x="480" y="22" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">CLIENT</text>
  <text x="480" y="118" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">API GATEWAY + AUTH</text>
  <text x="480" y="258" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">GUARDRAILS  —  LAYER 1 (INPUT)</text>
  <text x="480" y="368" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">HYBRID RETRIEVAL</text>
  <text x="480" y="508" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">GUARDRAILS  —  LAYER 2 (CONTEXT) + RERANKER</text>
  <text x="480" y="618" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">MULTI-MODEL LLM</text>
  <text x="480" y="748" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">GUARDRAILS  —  LAYER 3+4 (OUTPUT + HALLUCINATION)</text>
  <text x="480" y="858" text-anchor="middle" font-size="10" fill="#484f58" font-weight="700" letter-spacing="1.5">PERSISTENCE</text>

  <!-- Dividers -->
  <line x1="30" y1="100" x2="930" y2="100" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="240" x2="930" y2="240" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="350" x2="930" y2="350" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="490" x2="930" y2="490" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="600" x2="930" y2="600" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="730" x2="930" y2="730" stroke="#21262d" stroke-width="1"/>
  <line x1="30" y1="840" x2="930" y2="840" stroke="#21262d" stroke-width="1"/>

  <!-- ROW 0: Client -->
  <rect x="80"  y="30" width="160" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="160" y="50" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">HTTP Client</text>
  <text x="160" y="68" text-anchor="middle" font-size="10" fill="#8b949e">POST /chat/query</text>

  <rect x="380" y="30" width="160" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="460" y="50" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Admin Client</text>
  <text x="460" y="68" text-anchor="middle" font-size="10" fill="#8b949e">POST /documents/upload</text>

  <rect x="680" y="30" width="160" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="760" y="50" text-anchor="middle" font-size="12" fill="#c9d1d9" font-weight="600">Swagger / ReDoc</text>
  <text x="760" y="68" text-anchor="middle" font-size="10" fill="#8b949e">GET /docs</text>

  <!-- Arrows → gateway -->
  <line x1="160" y1="78" x2="350" y2="128" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="460" y1="78" x2="460" y2="128" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="760" y1="78" x2="600" y2="128" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ROW 1: FastAPI + JWT -->
  <rect x="80" y="128" width="780" height="90" rx="10" fill="#1a1f6e" stroke="#3b41c5" stroke-width="1.3"/>
  <text x="470" y="153" text-anchor="middle" font-size="13" fill="#a5b4fc" font-weight="700">FastAPI application</text>
  <text x="470" y="171" text-anchor="middle" font-size="10" fill="#818cf8">CORS · lifespan · request timing · global error handler</text>
  <!-- JWT badge -->
  <rect x="250" y="181" width="130" height="24" rx="5" fill="#0d2d1a" stroke="#238636" stroke-width="1"/>
  <text x="315" y="197" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="600">JWT Bearer Auth</text>
  <!-- RBAC badge -->
  <rect x="400" y="181" width="140" height="24" rx="5" fill="#0d2d1a" stroke="#238636" stroke-width="1"/>
  <text x="470" y="197" text-anchor="middle" font-size="10" fill="#3fb950" font-weight="600">RBAC (user | admin)</text>
  <!-- OAuth2 badge -->
  <rect x="560" y="181" width="150" height="24" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="635" y="197" text-anchor="middle" font-size="10" fill="#8b949e" font-weight="600">OAuth2PasswordBearer</text>

  <!-- Arrow gateway → guardrail 1 -->
  <line x1="470" y1="218" x2="470" y2="268" stroke="#a5b4fc" stroke-width="1.3" marker-end="url(#arr-p)"/>

  <!-- ROW 2: Guardrail Layer 1 (Input) -->
  <rect x="80" y="268" width="780" height="62" rx="10" fill="#2d0a0a" stroke="#f85149" stroke-width="1.3"/>
  <text x="470" y="291" text-anchor="middle" font-size="13" fill="#f85149" font-weight="700">🛡️ Input Guardrail</text>
  <text x="470" y="310" text-anchor="middle" font-size="10" fill="#c9a02a">Off-topic blocking · Harmful content detection · Min-length check · Crisis intervention redirect</text>

  <!-- Block arrow left (blocked) -->
  <line x1="100" y1="299" x2="50" y2="299" stroke="#f85149" stroke-width="1.3" marker-end="url(#arr-r)"/>
  <text x="34" y="296" text-anchor="end" font-size="9" fill="#f85149">BLOCK</text>
  <!-- Pass arrow down -->
  <line x1="470" y1="330" x2="470" y2="378" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="490" y="358" font-size="9" fill="#56d364">PASS ✓</text>

  <!-- ROW 3: Hybrid Retrieval -->
  <rect x="80" y="378" width="460" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="310" y="400" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="700">Hybrid Retriever</text>
  <!-- Semantic pill -->
  <rect x="100" y="412" width="180" height="26" rx="5" fill="#1a1f6e" stroke="#3b41c5" stroke-width="1"/>
  <text x="190" y="429" text-anchor="middle" font-size="10" fill="#a5b4fc" font-weight="600">Semantic (ChromaDB)</text>
  <!-- BM25 pill -->
  <rect x="300" y="412" width="120" height="26" rx="5" fill="#1a1000" stroke="#d29922" stroke-width="1"/>
  <text x="360" y="429" text-anchor="middle" font-size="10" fill="#f0c040" font-weight="600">BM25 Keyword</text>
  <text x="310" y="456" text-anchor="middle" font-size="10" fill="#484f58">RRF Fusion (k=60) → Top-K merged results</text>

  <!-- Chat history box -->
  <rect x="570" y="378" width="290" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="715" y="400" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="700">Chat History</text>
  <text x="715" y="420" text-anchor="middle" font-size="10" fill="#8b949e">PostgreSQL · per session_id</text>
  <text x="715" y="438" text-anchor="middle" font-size="10" fill="#8b949e">HumanMessage + AIMessage</text>
  <text x="715" y="456" text-anchor="middle" font-size="10" fill="#484f58">last N turns as LangChain memory</text>

  <!-- Arrows retrieval → guardrail 2 -->
  <line x1="310" y1="468" x2="400" y2="518" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="715" y1="468" x2="560" y2="518" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ROW 4: Guardrail Layer 2 + Reranker -->
  <rect x="80" y="518" width="460" height="62" rx="10" fill="#2d0a0a" stroke="#f85149" stroke-width="1.3"/>
  <text x="310" y="541" text-anchor="middle" font-size="13" fill="#f85149" font-weight="700">🛡️ Context Guardrail</text>
  <text x="310" y="560" text-anchor="middle" font-size="10" fill="#c9a02a">Insufficient context check → returns "not found" if context &lt; 100 chars</text>

  <rect x="570" y="518" width="290" height="62" rx="10" fill="#1a1000" stroke="#d29922" stroke-width="1.3"/>
  <text x="715" y="541" text-anchor="middle" font-size="13" fill="#f0c040" font-weight="700">Cross-Encoder Reranker</text>
  <text x="715" y="560" text-anchor="middle" font-size="10" fill="#c9a02a">ms-marco-MiniLM-L6 · Top-N selection</text>

  <!-- Arrows → LLM -->
  <line x1="310" y1="580" x2="400" y2="628" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="715" y1="580" x2="560" y2="628" stroke="#8b949e" stroke-width="1" marker-end="url(#arr)"/>

  <!-- ROW 5: LLM -->
  <rect x="80" y="628" width="780" height="90" rx="10" fill="#1c1c1c" stroke="#484f58" stroke-width="1.3"/>
  <text x="470" y="650" text-anchor="middle" font-size="13" fill="#c9d1d9" font-weight="700">Multi-Model LLM Router</text>
  <text x="470" y="668" text-anchor="middle" font-size="10" fill="#8b949e">ChatPromptTemplate · MessagesPlaceholder (history) · StrOutputParser</text>
  <!-- OpenAI pill -->
  <rect x="200" y="678" width="200" height="28" rx="6" fill="#0d2d1a" stroke="#238636" stroke-width="1"/>
  <text x="300" y="696" text-anchor="middle" font-size="11" fill="#3fb950" font-weight="600">① OpenAI  gpt-4o-mini</text>
  <!-- Groq pill -->
  <rect x="430" y="678" width="200" height="28" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="530" y="696" text-anchor="middle" font-size="11" fill="#8b949e" font-weight="600">② Groq  llama-3.3-70b ↩</text>

  <!-- Arrow → output guardrail -->
  <line x1="470" y1="718" x2="470" y2="758" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ROW 6: Output Guardrails -->
  <rect x="80" y="758" width="780" height="62" rx="10" fill="#2d0a0a" stroke="#f85149" stroke-width="1.3"/>
  <text x="470" y="781" text-anchor="middle" font-size="13" fill="#f85149" font-weight="700">🛡️ Output Guardrail + Hallucination Check</text>
  <text x="470" y="800" text-anchor="middle" font-size="10" fill="#c9a02a">Dangerous phrase strip · Medical disclaimer append · Hallucination signal detection</text>

  <!-- Arrow → response -->
  <line x1="470" y1="820" x2="470" y2="868" stroke="#3fb950" stroke-width="1.3" marker-end="url(#arr-g)"/>

  <!-- ROW 7: Persistence -->
  <!-- PostgreSQL -->
  <rect x="80" y="868" width="260" height="38" rx="8" fill="#0d2d1a" stroke="#238636" stroke-width="1"/>
  <text x="210" y="883" text-anchor="middle" font-size="11" fill="#3fb950" font-weight="600">PostgreSQL</text>
  <text x="210" y="898" text-anchor="middle" font-size="10" fill="#56d364">users · chat_history · docs metadata</text>
  <!-- ChromaDB -->
  <rect x="360" y="868" width="260" height="38" rx="8" fill="#1a1f6e" stroke="#3b41c5" stroke-width="1"/>
  <text x="490" y="883" text-anchor="middle" font-size="11" fill="#a5b4fc" font-weight="600">ChromaDB</text>
  <text x="490" y="898" text-anchor="middle" font-size="10" fill="#818cf8">embeddings · role-based metadata</text>
  <!-- Embeddings box -->
  <rect x="640" y="868" width="260" height="38" rx="8" fill="#1a1000" stroke="#d29922" stroke-width="1"/>
  <text x="770" y="883" text-anchor="middle" font-size="11" fill="#f0c040" font-weight="600">Embedding Models</text>
  <text x="770" y="898" text-anchor="middle" font-size="10" fill="#c9a02a">OpenAI / HuggingFace (MiniLM)</text>

</svg>
