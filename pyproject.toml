[project]
name = "medirag"
version = "0.1.0"
description = "MediRAG — guarded, document-grounded medical assistant (FastAPI, hybrid RAG, NeMo guardrails, DeepEval)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # web
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    # auth  (passlib 1.7.4 crashes with bcrypt 5.x → signup would return HTTP 500)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0",
    # LangChain + LLM providers
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "nemoguardrails>=0.24.1",
    # retrieval
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # documents / database / misc
    "pypdf>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    # evaluation (the evaluation API/UI imports DeepEval at startup)
    "deepeval>=3.0.0",
]

[project.optional-dependencies]
# Deep document parsing: layout, tables, OCR, DOCX/PPTX/HTML/images. Heavy (PyTorch + ONNX). See README.
docling = ["docling[rapidocr]>=2.150,<3"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "reportlab>=4.0.0",
    "python-docx>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# tests_e2e is run separately (it imports the real app, tests/ stubs parts of it): `uv run pytest tests_e2e`
testpaths = ["tests", "evaluation"]
